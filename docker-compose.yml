version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: bulk-email-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-bulk_email_agent}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-bulk_email_agent}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  bulk-email-agent:
    build:
      context: .
      dockerfile: Dockerfile
    image: bulk-email-agent:latest
    container_name: bulk-email-agent
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-bulk_email_agent}
    env_file:
      - .env
    volumes:
      - email_agent_attachments:/app/data/attachments
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  postgres_data:
    name: bulk_email_postgres_data
  email_agent_attachments:
    name: bulk_email_agent_attachments
